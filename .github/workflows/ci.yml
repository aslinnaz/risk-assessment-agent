name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No API credentials are available or needed: the offline suite uses a scripted model.
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tested.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tested.txt

      - name: Syntax and import check
        run: |
          python -m py_compile *.py tools/*.py evals/*.py tests/*.py
          python -c "import config, llm, rag, classify, interview, planner, report, sources_admin"

      - name: Portable tests (no source documents)
        shell: bash
        run: |
          EMPTY="$(mktemp -d)"
          TRUSTAI_SOURCES_DIR="$EMPTY" python -m pytest -q -rs -p no:cacheprovider 2>&1 | tee portable.txt
          echo "Portable suite (empty sources): $(tail -1 portable.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Full offline tests (uses sources/ if present in the checkout)
        shell: bash
        run: |
          python -m pytest -q -rs -p no:cacheprovider 2>&1 | tee full.txt
          echo "Full offline suite: $(tail -1 full.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "A skipped test is not a pass: source-dependent tests skip when a source PDF is missing." >> "$GITHUB_STEP_SUMMARY"

      - name: Catalog verification (only if all required sources are present)
        shell: bash
        run: |
          if python -c "import rag; rag.check_sources()" 2>/dev/null; then
            python tools/verify_catalog.py
          else
            echo "tools/verify_catalog.py skipped: required source files are not in this checkout." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
